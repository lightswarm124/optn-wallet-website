 <text class="t h2" x="26" y="80" fill="#102D26">OPTN Wallet</text>
 <rect x="26" y="102" width="94" height="31" rx="15" fill="#CBF6E4"/>
 <circle cx="45" cy="118" r="6" fill="#16A579"/><text class="t x" x="59" y="122" fill="#174C3E">SHIPPED</text>
 <line x1="26" y1="157" x2="274" y2="157" stroke="#D8E0DC"/>
 <text class="t s" x="26" y="194" fill="#284A41">Self-custody BCH wallet with</text>
