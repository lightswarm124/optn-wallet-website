 <line x1="26" y1="187" x2="274" y2="187" stroke="#D8E0DC"/>
 <text class="t s" x="26" y="224" fill="#284A41">Bounded transaction paths</text>
 <text class="t s" x="26" y="250" fill="#284A41">for software and AI payments.</text>
 <text class="t x" x="26" y="280" fill="#6C817A">Covenant enforcement only applies</text>
 <text class="t x" x="26" y="299" fill="#6C817A">to BCH/CashToken funds deliberately</text>
 <text class="t x" x="26" y="318" fill="#6C817A">placed under covenant control.</text>
