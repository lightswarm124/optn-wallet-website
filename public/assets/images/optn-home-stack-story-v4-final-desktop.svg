 <text class="t s" x="26" y="246" fill="#284A41">and advanced transaction flows.</text>
 <text class="t x" x="26" y="283" fill="#6C817A">Primary product proof.</text>
</g>

<g transform="translate(455,435)">
 <rect width="390" height="330" rx="22" fill="#FBFAF6"/>
