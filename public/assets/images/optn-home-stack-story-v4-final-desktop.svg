<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">OPTN Labs product story</title>
<desc id="desc">Use, Build, Control, Work progression. OPTN Wallet is shipped. Developer resources and BCH infrastructure are available now. Programmable payments are in development. Scoped Engineering is available now. Covenant enforcement applies only to BCH and CashToken funds deliberately placed under covenant control.</desc>
