<text class="t h1" x="112" y="178" fill="#FFFFFF">From shipped product</text>
<text class="t h1" x="112" y="228" fill="#FFFFFF">to programmable payments</text>
<text class="t b" x="112" y="272" fill="#C8E8DC">A product-first path from OPTN Wallet to reusable developer resources, BCH infrastructure,</text>
<text class="t b" x="112" y="300" fill="#C8E8DC">programmable payments in development, and scoped Engineering.</text>

<text class="t ey" x="185" y="360" fill="#A9F4D7">USE</text>
<text class="t ey" x="535" y="360" fill="#A9F4D7">BUILD</text>
