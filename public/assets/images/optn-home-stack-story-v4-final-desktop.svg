 <circle cx="45" cy="148" r="6" fill="#16A579"/><text class="t x" x="59" y="152" fill="#174C3E">AVAILABLE NOW</text>
 <line x1="26" y1="187" x2="364" y2="187" stroke="#D8E0DC"/>
 <text class="t s" x="26" y="224" fill="#284A41">Public resources, integration guidance,</text>
